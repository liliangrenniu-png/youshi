        }, 3000);
      } else {
        ts("复制失败，请长按链接手动复制", false);
      }
    });
  };

  // ======= 密码弹窗 =======
  function showPwDialog() {
    document.getElementById("pwOverlay").style.display = "flex";
    document.getElementById("pwInput").value = "";
    document.getElementById("pwErr").style.display = "none";
    setTimeout(function() { document.getElementById("pwInput").focus(); }, 200);
  }
  document.getElementById("pwSubmitBtn").addEventListener("click", function() {
    var v = document.getElementById("pwInput").value;
    if (v === ADMIN_PWD) {
      pwOk = true;
      isA = true;
      document.getElementById("pwOverlay").style.display = "none";
      rN(); rB();
    } else {
      document.getElementById("pwErr").style.display = "block";
      document.getElementById("pwInput").value = "";
      document.getElementById("pwInput").focus();
    }
  });
  document.getElementById("pwCancelBtn").addEventListener("click", function() {
    document.getElementById("pwOverlay").style.display = "none";
    isA = false;
    pwOk = false;
    var url = new URL(location.href);
    url.searchParams.delete("admin");
    history.replaceState(null, "", url.toString());
    rN(); rB();
  });
  document.getElementById("pwInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") document.getElementById("pwSubmitBtn").click();
  });

  // ======= 微信复制 =======
  document.getElementById("wxCopy").addEventListener("click", function() { cp("mimi202603", "微信号"); });
  document.getElementById("wxCopy2").addEventListener("click", function(e) { e.preventDefault(); cp("mimi202603", "微信号"); });

  // ======= 工具函数 =======
  function uC() { document.getElementById("cnt").textContent = D.length + " 条资料"; }
  function esc(s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

  // ======= 导航 =======
  function rN() {
    var n = document.getElementById("nv");
    if (!isA || !pwOk) {
      n.innerHTML = '<button class="nb on" id="navBrowse">📖 汇总</button>';
    } else {
      n.innerHTML = '<button class="nb on" id="navBrowse">📖 汇总</button><button class="nb" id="navAdmin">⚙️ 管理</button>';
    }
    // 绑定事件
    var browseBtn = document.getElementById("navBrowse");
    if (browseBtn) browseBtn.addEventListener("click", function() { sp(0); });
    var adminBtn = document.getElementById("navAdmin");
    if (adminBtn) adminBtn.addEventListener("click", function() { sp(1); });
  }
  function sp(p) {
    document.getElementById("pg0").style.display = (p === 0) ? "" : "none";
    document.getElementById("pg1").style.display = (p === 1) ? "" : "none";
    var b = document.getElementById("navBrowse");
    var a = document.getElementById("navAdmin");
    if (b) b.className = "nb" + (p === 0 ? " on" : "");
    if (a) a.className = "nb" + (p === 1 ? " on" : "");
    if (p === 1) rA();
    if (p === 0) rB();
  }

  // ======= 筛选 =======
  window.setFilter = function(cat) { fC = cat; bF(); rB(); };
  function bF() {
    var a = ["全部"].concat(CS);
    document.getElementById("flt").innerHTML = a.map(function(c) {
      var clr = c === "全部" ? "#7a6e64" : CLR[c];
      var on = fC === c;
      return '<button class="fc' + (on ? " on" : "") + '" style="' + (on ? "background:" + clr + ";color:#fff;border:none" : "color:var(--text2)") + '" onclick="setFilter(\'' + c + '\')">' + (c !== "全部" ? CI[c] + " " : "") + c + '</button>';
    }).join("");
  }

  // ======= 浏览页渲染 =======
  function rB() {
    var s = (document.getElementById("sch").value || "").trim().toLowerCase();
    var f = D.filter(function(i) {
      if (fC !== "全部" && i.c !== fC) return false;
      if (s) return i.e.toLowerCase().indexOf(s) >= 0 || (i.s || "").toLowerCase().indexOf(s) >= 0 || i.c.indexOf(s) >= 0;
      return true;
    });
    var g = {};
    f.forEach(function(i) { if (!g[i.c]) g[i.c] = []; g[i.c].push(i); });
    var el = document.getElementById("bl");
    if (!f.length) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>暂无资料' + (isA && pwOk ? '，请在管理后台添加' : '') + '</p></div>';
      return;
    }
    var h = "";
    CS.forEach(function(cat) {
      if (!g[cat]) return;
      h += '<div class="cs"><div class="ch"><span class="cat-pill" style="background:' + CLR[cat] + '"><span class="cat-3d">' + CI[cat] + '</span> ' + cat + '</span><span class="ccn">' + g[cat].length + '条</span></div>';
      h += '<div class="masonry">';
      g[cat].forEach(function(i) {
        var idx = D.indexOf(i);
        h += '<div class="card"><div class="card-top"><div class="card-icon-wrap" style="background:' + CLRB[i.c] + '">' + CI[i.c] + '</div><div class="card-info"><h3>' + esc(i.e) + '</h3>' + (i.s ? '<span class="card-sub">' + esc(i.s) + '</span>' : '') + '</div></div><button class="cp-btn" style="background:' + CLR[i.c] + '" onclick="cpBtn(this,' + idx + ')">复制链接</button></div>';
      });
      h += '</div></div>';
    });
    el.innerHTML = h;
  }

  // ======= 管理页渲染 =======
  function rA() {
    if (!isA || !pwOk) { sp(0); return; }
    var h = '<div class="afc"><h2 class="aft">➕ 添加新资料</h2><div class="afg">';
    h += '<label class="afl"><span>大类目</span><select class="afs" id="fc">' + CS.map(function(c) { return '<option value="' + c + '">' + CI[c] + ' ' + c + '</option>'; }).join("") + '</select></label>';
    h += '<label class="afl"><span>考试名称</span><input class="afi" id="fe" placeholder="如：一级建造师"></label>';
    h += '<label class="afl"><span>科目名称（选填）</span><input class="afi" id="fs" placeholder="如：建设工程经济"></label>';
    h += '<label class="afl full"><span>网盘链接</span><input class="afi" id="fl" placeholder="粘贴百度网盘 / 阿里云盘链接"></label>';
    h += '</div><button class="sub" id="submitBtn">提交添加</button></div>';
    h += '<h2 class="aft" style="margin:28px 0 14px">📑 已有 ' + D.length + ' 条资料</h2>';
    if (!D.length) {
      h += '<div class="empty"><div class="empty-icon">📭</div><p>还没有添加任何资料</p></div>';
    } else {
      h += '<div class="admin-list">';
      D.forEach(function(i, idx) {
        if (eId === i.id) {
          h += '<div class="edit-card"><div class="afg">';
          h += '<label class="afl"><span>类目</span><select class="afs" id="ec">' + CS.map(function(c) { return '<option value="' + c + '"' + (i.c === c ? ' selected' : '') + '>' + c + '</option>'; }).join("") + '</select></label>';
          h += '<label class="afl"><span>考试名称</span><input class="afi" id="ee" value="' + esc(i.e) + '"></label>';
          h += '<label class="afl"><span>科目</span><input class="afi" id="es" value="' + esc(i.s) + '"></label>';
          h += '<label class="afl full"><span>链接</span><input class="afi" id="el" value="' + esc(i.l) + '"></label>';
          h += '</div><div class="edit-btns"><button onclick="cancelEdit()">取消</button><button class="save-btn" onclick="saveEdit(\'' + i.id + '\')">保存修改</button></div></div>';
        } else {
          h += '<div class="admin-item"><div class="ai-head"><span class="ai-tag" style="background:' + CLR[i.c] + '">' + CI[i.c] + ' ' + i.c + '</span><span class="ai-name">' + esc(i.e) + '</span></div>';
          if (i.s) h += '<div class="ai-sub">' + esc(i.s) + '</div>';
          h += '<div class="ai-actions"><button class="ai-btn cp" onclick="cpBtn(this,' + idx + ')">📋 复制链接</button><button class="ai-btn" onclick="startEdit(\'' + i.id + '\')">✏️ 编辑</button><button class="ai-btn dg" onclick="delItem(\'' + i.id + '\')">🗑️ 删除</button></div></div>';
        }
      });
      h += '</div>';
    }
    h += '<div class="pub-bar"><div><p>📤 发布更新</p><small>下载新版网页文件，上传替换即可</small></div><button class="pub-btn" onclick="exportHTML()">⬇ 下载发布版</button></div>';
    document.getElementById("pg1").innerHTML = h;
    // 绑定提交按钮
    var sb = document.getElementById("submitBtn");
    if (sb) sb.addEventListener("click", addI);
  }

  // ======= CRUD =======
  function addI() {
    var e = document.getElementById("fe").value.trim();
    var l = document.getElementById("fl").value.trim();
    if (!e || !l) { ts("请填写考试名称和网盘链接", false); return; }
    D.unshift({ id: Date.now() + "", c: document.getElementById("fc").value, e: e, s: document.getElementById("fs").value.trim(), l: l });
    uC(); rA();
    ts("添加成功");
  }
  window.startEdit = function(id) { eId = id; rA(); };
  window.cancelEdit = function() { eId = null; rA(); };
  window.saveEdit = function(id) {
    var e = document.getElementById("ee").value.trim();
    var l = document.getElementById("el").value.trim();
    if (!e || !l) { ts("名称和链接不能为空", false); return; }
    D = D.map(function(i) {
      if (i.id !== id) return i;
      return { id: i.id, c: document.getElementById("ec").value, e: e, s: document.getElementById("es").value.trim(), l: l };
    });
    eId = null; rA(); ts("修改已保存");
  };
  window.delItem = function(id) {
    if (!confirm("确定删除？")) return;
    D = D.filter(function(i) { return i.id !== id; });
    uC(); rA(); ts("已删除");
  };

  // ======= 导出 =======
  window.exportHTML = function() {
    var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    var nd = JSON.stringify(D);
    html = html.replace(/<!-- DATA_START -->[\s\S]*?<!-- DATA_END -->/, '<!-- DATA_START -->\n<script id="app-data" type="application/json">' + nd + '<\/script>\n<!-- DATA_END -->');
    var b = new Blob([html], { type: "text/html;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "index.html";
    a.click();
    URL.revokeObjectURL(a.href);
    ts("已下载，上传替换即可发布");
  };

  // ======= 初始化 =======
  function init() {
    try { D = JSON.parse(document.getElementById("app-data").textContent || "[]"); } catch(e) { D = []; }
    var wantAdmin = new URLSearchParams(location.search).get("admin") === "true";
    if (wantAdmin) { showPwDialog(); }
    rN(); bF(); rB(); uC();
  }

  init();
})();
</script>
</body>
</html>
